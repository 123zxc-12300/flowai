<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录注册 — FlowAI 流智</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--teal-50), #f0fdfa, #ecfeff);
    padding: var(--spacing-xl);
  }
  .auth-card {
    background: var(--white);
    border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-xl);
    padding: var(--spacing-3xl);
    width: 100%;
    max-width: 420px;
    animation: fadeInUp 0.5s ease;
  }
  .auth-logo { text-align: center; margin-bottom: var(--spacing-2xl); }
  .auth-logo .logo-text { font-size: var(--font-size-2xl); font-weight: 900; }

  .auth-tabs {
    display: flex; gap: 0; margin-bottom: var(--spacing-xl);
    background: var(--gray-100); border-radius: var(--radius-lg); padding: 4px;
  }
  .auth-tab {
    flex: 1; text-align: center; padding: 0.625rem;
    font-size: var(--font-size-sm); font-weight: 700; border-radius: var(--radius-md);
    cursor: pointer; transition: all var(--transition); border: none;
    background: transparent; color: var(--gray-500); font-family: var(--font-family);
  }
  .auth-tab.active { background: var(--white); color: var(--gray-900); box-shadow: var(--shadow-sm); }
  .auth-form { display: none; }
  .auth-form.active { display: block; }

  .form-group { margin-bottom: var(--spacing-md); }
  .form-group label { display: block; font-size: var(--font-size-sm); font-weight: 700; color: var(--gray-700); margin-bottom: 0.375rem; }
  .form-input {
    width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--gray-200);
    border-radius: var(--radius-lg); font-size: var(--font-size-base);
    font-family: var(--font-family); transition: border-color var(--transition); background: var(--gray-50);
  }
  .form-input:focus { outline: none; border-color: var(--teal-400); background: var(--white); }
  .form-row { display: flex; gap: var(--spacing-sm); }
  .form-row .form-input { flex: 1; }

  .btn-send-code {
    padding: 0.75rem 1rem; background: var(--teal-50); color: var(--teal-600);
    border: 2px solid var(--teal-200); border-radius: var(--radius-lg);
    font-size: var(--font-size-sm); font-weight: 700; cursor: pointer;
    white-space: nowrap; font-family: var(--font-family); transition: all var(--transition);
  }
  .btn-send-code:hover { background: var(--teal-100); }
  .btn-send-code:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-full { width: 100%; padding: 0.875rem; font-size: var(--font-size-base); margin-top: var(--spacing-sm); }

  .form-error { color: #ef4444; font-size: var(--font-size-sm); margin-top: var(--spacing-sm); text-align: center; display: none; }
  .form-success { color: var(--teal-600); font-size: var(--font-size-sm); margin-top: var(--spacing-sm); text-align: center; display: none; }
  .auth-footer { text-align: center; margin-top: var(--spacing-lg); }
  .auth-footer a { color: var(--gray-500); font-size: var(--font-size-sm); text-decoration: underline; }
  .auth-footer a:hover { color: var(--teal-600); }

  /* Toast */
  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 14px 20px; border-radius: var(--radius-lg); font-size: var(--font-size-sm);
    font-weight: 600; color: var(--white); box-shadow: var(--shadow-xl);
    animation: toastIn 0.3s ease; max-width: 380px;
    display: flex; align-items: center; gap: 10px;
  }
  .toast--error { background: #ef4444; }
  .toast--success { background: var(--teal-600); }
  .toast--warn { background: var(--accent); color: var(--gray-900); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-text">🌊 FlowAI<span class="logo-accent">流智</span></span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>

    <!-- 登录 -->
    <form class="auth-form active" id="login-form" autocomplete="off">
      <div class="form-group">
        <label>手机号</label>
        <input class="form-input" type="tel" id="login-phone" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-input" type="password" id="login-password" placeholder="请输入密码" minlength="6">
      </div>
      <div class="form-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">登录</button>
    </form>

    <!-- 注册 -->
    <form class="auth-form" id="register-form" autocomplete="off">
      <div class="form-group">
        <label>手机号</label>
        <input class="form-input" type="tel" id="reg-phone" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="form-group">
        <label>验证码</label>
        <div class="form-row">
          <input class="form-input" type="text" id="reg-code" placeholder="请输入验证码" maxlength="6">
          <button type="button" class="btn-send-code" id="btn-send-code">获取验证码</button>
        </div>
      </div>
      <div class="form-group">
        <label>设置密码</label>
        <input class="form-input" type="password" id="reg-password" placeholder="至少6位密码" minlength="6">
      </div>
      <div class="form-error" id="register-error"></div>
      <div class="form-success" id="register-success"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">注册并领取 ¥1 体验金</button>
    </form>

    <div class="auth-footer">
      <a href="/">← 返回首页</a>
    </div>
  </div>
</div>

<script>
// 已登录自动跳转工作台
if (localStorage.getItem('flowai_token')) {
  window.location.href = '/app/';
}

// Toast
function showToast(msg, type) {
  var icons = { error: '⚠️', success: '✅', warn: '💡' };
  var t = document.createElement('div');
  t.className = 'toast toast--' + type;
  t.innerHTML = '<span>' + (icons[type] || '📢') + '</span><span>' + msg + '</span>';
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

// 标签切换
document.querySelectorAll('.auth-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.auth-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    document.querySelectorAll('.auth-form').forEach(function(f) { f.classList.remove('active'); });
    document.getElementById(tab.dataset.tab + '-form').classList.add('active');
    document.querySelectorAll('.form-error, .form-success').forEach(function(e) { e.style.display = 'none'; });
  });
});

function showError(form, msg) {
  var el = document.getElementById(form + '-error');
  el.textContent = msg;
  el.style.display = 'block';
}

// 发送验证码
var countdown = 0;
document.getElementById('btn-send-code').addEventListener('click', function() {
  var phone = document.getElementById('reg-phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return showError('register', '请输入正确的手机号');
  if (countdown > 0) return;

  fetch('/api/auth/send-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      // 自动填入验证码
      if (data.code) {
        document.getElementById('reg-code').value = data.code;
        var el = document.getElementById('register-success');
        el.textContent = '🔑 验证码已在输入框中：' + data.code;
        el.style.display = 'block';
        document.getElementById('register-error').style.display = 'none';
      }
      // 倒计时
      countdown = 60;
      var btn = document.getElementById('btn-send-code');
      btn.disabled = true;
      var timer = setInterval(function() {
        countdown--;
        btn.textContent = countdown + 's';
        if (countdown <= 0) {
          clearInterval(timer);
          btn.textContent = '获取验证码';
          btn.disabled = false;
        }
      }, 1000);
    })
    .catch(function(err) {
      showError('register', err.message);
    });
});

// 登录
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var phone = document.getElementById('login-phone').value.trim();
  var password = document.getElementById('login-password').value;
  if (!phone) return showError('login', '请输入手机号');
  if (!password) return showError('login', '请输入密码');

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, password: password })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      localStorage.setItem('flowai_token', data.token);
      localStorage.setItem('flowai_user', JSON.stringify(data.user));
      window.location.href = '/app/';
    })
    .catch(function(err) { showError('login', err.message); });
});

// 注册
document.getElementById('register-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var phone = document.getElementById('reg-phone').value.trim();
  var code = document.getElementById('reg-code').value.trim();
  var password = document.getElementById('reg-password').value;
  if (!phone) return showError('register', '请输入手机号');
  if (!code) return showError('register', '请输入验证码');
  if (!password || password.length < 6) return showError('register', '密码至少6位');

  fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, code: code, password: password })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      var el = document.getElementById('register-success');
      el.textContent = data.message + ' — 3秒后跳转到登录';
      el.style.display = 'block';
      document.getElementById('register-error').style.display = 'none';
      setTimeout(function() {
        document.querySelector('.auth-tab[data-tab="login"]').click();
        document.getElementById('login-phone').value = phone;
      }, 2000);
    })
    .catch(function(err) { showError('register', err.message); });
});

// URL tab 参数
if (window.location.search.indexOf('tab=register') !== -1) {
  document.querySelector('.auth-tab[data-tab="register"]').click();
}
</script>
</body>
</html>
